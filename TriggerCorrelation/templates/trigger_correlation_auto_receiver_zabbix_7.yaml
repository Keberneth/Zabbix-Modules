zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 84458918c2134930af402f117a019fe2
      name: Templates/Trigger Correlation
  templates:
    - uuid: 1b1a5c4abd234a05b307df4b5fd7ce0c
      template: 'Template Trigger Correlation Auto Receiver'
      name: 'Template Trigger Correlation Auto Receiver'
      vendor:
        name: Keberneth
        version: '7.0.0.0'
      groups:
        - name: Templates/Trigger Correlation
      description: |
        Receiver template for the correlation hosts that the Trigger Correlation module creates AUTOMATICALLY
        (one host per set of source hosts, e.g. "Correlation: db01 + web01").

        You normally never link this yourself: the module imports it and links it when you save a rule with
        Output = "Automatic correlation host".

        It holds only the discovery rule and the item/trigger prototypes. It deliberately has NO evaluator
        heartbeat item — the single engine host ("Template Trigger Correlation Receiver") calls eval.php once a
        minute for every rule, so the automatic hosts must not each call it again.

        The module pushes LLD discovery JSON to trigger.correlation.discovery and pushes state/context values with history.push.
        State values:
        0 = OK
        1 = Information
        2 = Warning
        3 = Average
        4 = High
        5 = Critical/Disaster
      discovery_rules:
        - uuid: 4285f8c5878f4fc09046a1da29688364
          name: 'Trigger correlation discovery'
          type: TRAP
          key: trigger.correlation.discovery
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'LLD data is pushed by the Trigger Correlation module.'
          item_prototypes:
            - uuid: b239e70e5a904c80a1693ae2f9908afe
              name: 'Correlation state: {#CORRELATION.NAME}'
              type: TRAP
              key: 'trigger.correlation.state[{#CORRELATION.ID}]'
              delay: '0'
              history: 90d
              trends: '365d'
              value_type: UNSIGNED
              description: |
                Correlated severity written by the Trigger Correlation module: 0 = OK/clear, 1 = Information, 2 = Warning, 3 = Average, 4 = High, 5 = Disaster. It is a trapper item, so it never becomes "unsupported"; the module pushes 0 to clear (and on rule delete), so "no data" simply means the rule has not been evaluated yet. {#CORRELATION.DESCRIPTION}
              valuemap:
                name: 'Correlation state'
              tags:
                - tag: component
                  value: correlation
                - tag: scope
                  value: trigger-correlation
                - tag: correlation.id
                  value: '{#CORRELATION.ID}'
            - uuid: b86e1d983c17425dbf55a76f22fd166d
              name: 'Correlation context: {#CORRELATION.NAME}'
              type: TRAP
              key: 'trigger.correlation.context[{#CORRELATION.ID}]'
              delay: '0'
              history: 90d
              trends: '0'
              value_type: TEXT
              description: 'JSON context pushed by the module. Contains matched source event IDs, host names and trigger names.'
              tags:
                - tag: component
                  value: correlation
                - tag: scope
                  value: trigger-correlation
                - tag: correlation.id
                  value: '{#CORRELATION.ID}'
          trigger_prototypes:
            - uuid: 66b3411c9ce94cccb45e0c710f962353
              expression: 'last(/Template Trigger Correlation Auto Receiver/trigger.correlation.state[{#CORRELATION.ID}])=1'
              name: 'Correlation INFORMATION: {#CORRELATION.NAME}'
              priority: INFO
              description: '{#CORRELATION.DESCRIPTION}'
              tags:
                - tag: component
                  value: correlation
                - tag: scope
                  value: trigger-correlation
                - tag: correlation.id
                  value: '{#CORRELATION.ID}'
            - uuid: f068ad002e104f28ae4ceeec15ab0779
              expression: 'last(/Template Trigger Correlation Auto Receiver/trigger.correlation.state[{#CORRELATION.ID}])=2'
              name: 'Correlation WARNING: {#CORRELATION.NAME}'
              priority: WARNING
              description: '{#CORRELATION.DESCRIPTION}'
              tags:
                - tag: component
                  value: correlation
                - tag: scope
                  value: trigger-correlation
                - tag: correlation.id
                  value: '{#CORRELATION.ID}'
            - uuid: 381185444d314ab29e6e403128d1741d
              expression: 'last(/Template Trigger Correlation Auto Receiver/trigger.correlation.state[{#CORRELATION.ID}])=3'
              name: 'Correlation AVERAGE: {#CORRELATION.NAME}'
              priority: AVERAGE
              description: '{#CORRELATION.DESCRIPTION}'
              tags:
                - tag: component
                  value: correlation
                - tag: scope
                  value: trigger-correlation
                - tag: correlation.id
                  value: '{#CORRELATION.ID}'
            - uuid: 213b3289b51d46ac83f0bf3f790c208d
              expression: 'last(/Template Trigger Correlation Auto Receiver/trigger.correlation.state[{#CORRELATION.ID}])=4'
              name: 'Correlation HIGH: {#CORRELATION.NAME}'
              priority: HIGH
              description: '{#CORRELATION.DESCRIPTION}'
              tags:
                - tag: component
                  value: correlation
                - tag: scope
                  value: trigger-correlation
                - tag: correlation.id
                  value: '{#CORRELATION.ID}'
            - uuid: 214ec1cba53042c8891f18241745671a
              expression: 'last(/Template Trigger Correlation Auto Receiver/trigger.correlation.state[{#CORRELATION.ID}])=5'
              name: 'Correlation CRITICAL: {#CORRELATION.NAME}'
              priority: DISASTER
              description: '{#CORRELATION.DESCRIPTION}'
              tags:
                - tag: component
                  value: correlation
                - tag: scope
                  value: trigger-correlation
                - tag: correlation.id
                  value: '{#CORRELATION.ID}'
      valuemaps:
        - uuid: c387ca89406b4ba5aa3832681132132d
          name: 'Correlation state'
          mappings:
            - value: '0'
              newvalue: OK
            - value: '1'
              newvalue: Information
            - value: '2'
              newvalue: Warning
            - value: '3'
              newvalue: Average
            - value: '4'
              newvalue: High
            - value: '5'
              newvalue: Critical/Disaster
