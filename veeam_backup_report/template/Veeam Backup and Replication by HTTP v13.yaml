                  event_name: 'Low free space on repository [{#NAME}]'
                  opdata: 'Free: {ITEM.LASTVALUE1}%'
                  priority: WARNING
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Critically low free space on repository'
                      expression: 'min(/Veeam Backup and Replication by HTTP v13/veeam.repository.free.pct[{#ID}],15m)<{$VEEAM.REPO.FREE.PCT.CRIT}'
                  tags:
