        - uuid: 382ba78499904e8f84dd68511c93ff7f
          name: 'Get metrics'
          type: SCRIPT
          key: veeam.get.metrics
          delay: '{$VEEAM.METRICS.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var Veeam = {
                params: {},
                token: '',
            
                setParams: function (params) {
                    var required = ['api_endpoint', 'api_version', 'page_limit', 'user', 'password'],
                        i;
            
                    for (i = 0; i < required.length; i++) {
                        if (typeof params !== 'object' || typeof params[required[i]] === 'undefined' || params[required[i]] === '') {
                            throw 'Required param is not set: ' + required[i] + '.';
                        }
                    }
            
                    this.params = params;
            
                    if (typeof this.params.api_endpoint === 'string' && !/\/$/.test(this.params.api_endpoint)) {
                        this.params.api_endpoint += '/';
                    }
            
                    this.params.page_limit = parseInt(this.params.page_limit, 10);
                    if (isNaN(this.params.page_limit) || this.params.page_limit < 1 || this.params.page_limit > 1000) {
                        throw 'Incorrect "page_limit" parameter given: ' + params.page_limit + '. Must be between 1 and 1000.';
                    }
                },
            
                buildUrl: function (path, query) {
                    var url = this.params.api_endpoint + String(path).replace(/^\//, ''),
                        parts = [],
                        k;
            
                    query = query || {};
            
                    for (k in query) {
                        if (query.hasOwnProperty(k) && query[k] !== '' && query[k] !== null && typeof query[k] !== 'undefined') {
                            parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(query[k]));
                        }
                    }
            
                    if (parts.length) {
                        url += ((url.indexOf('?') === -1) ? '?' : '&') + parts.join('&');
                    }
            
                    return url;
                },
            
                createRequest: function () {
                    var req = new HttpRequest();
            
                    if (typeof this.params.http_proxy !== 'undefined' && this.params.http_proxy !== '') {
                        req.setProxy(this.params.http_proxy);
                    }
            
                    req.addHeader('Authorization: Bearer ' + this.token);
                    req.addHeader('x-api-version: ' + this.params.api_version);
            
                    return req;
                },
            
                login: function () {
                    var req = new HttpRequest(),
                        resp;
            
                    if (typeof this.params.http_proxy !== 'undefined' && this.params.http_proxy !== '') {
                        req.setProxy(this.params.http_proxy);
                    }
            
                    req.addHeader('Content-Type: application/x-www-form-urlencoded');
                    req.addHeader('x-api-version: ' + this.params.api_version);
            
                    resp = req.post(
                        this.params.api_endpoint + 'api/oauth2/token',
                        'grant_type=password&username=' + encodeURIComponent(this.params.user) +
                        '&password=' + encodeURIComponent(this.params.password)
                    );
            
                    if (req.getStatus() !== 200 || resp === null) {
                        throw 'Login failed with status code ' + req.getStatus() + ': ' + resp;
                    }
            
                    try {
                        resp = JSON.parse(resp);
                    }
                    catch (error) {
                        throw 'Failed to parse authentication token for the logon session.';
                    }
            
                    if (!resp.hasOwnProperty('access_token')) {
                        throw 'Auth response does not contain access token.';
                    }
            
                    this.token = resp.access_token;
                },
            
                request: function (url) {
                    var req = this.createRequest(),
                        resp;
            
                    resp = req.get(url);
            
                    if (req.getStatus() !== 200 || resp === null) {
                        throw 'Request failed with status code ' + req.getStatus() + ': ' + resp;
                    }
            
                    try {
                        return JSON.parse(resp);
                    }
                    catch (error) {
                        throw 'Failed to parse response received from API.';
                    }
                },
            
                getAll: function (path, query) {
                    var all = [],
                        skip = 0,
                        limit = this.params.page_limit,
                        resp,
                        count,
                        i,
                        guard = 0,
                        pageQuery,
                        pagination = {
                            total: 0,
                            count: 0,
                            skip: 0,
                            limit: limit
                        };
            
                    query = query || {};
            
                    while (true) {
                        guard += 1;
            
                        if (guard > 1000) {
                            throw 'Pagination guard limit exceeded for endpoint: ' + path;
                        }
            
                        pageQuery = {};
                        for (i in query) {
                            if (query.hasOwnProperty(i)) {
                                pageQuery[i] = query[i];
                            }
                        }
            
                        pageQuery.skip = skip;
                        pageQuery.limit = limit;
            
                        resp = this.request(this.buildUrl(path, pageQuery));
            
                        if (typeof resp !== 'object' || resp === null) {
                            throw 'Unexpected API response for endpoint: ' + path;
                        }
            
                        if (!resp.hasOwnProperty('data')) {
                            return resp;
                        }
            
                        count = resp.data.length;
            
                        for (i = 0; i < count; i++) {
                            all.push(resp.data[i]);
                        }
            
                        if (resp.hasOwnProperty('pagination')) {
                            pagination = resp.pagination;
                        }
            
                        if (!resp.hasOwnProperty('pagination') || count === 0 || count < limit) {
                            break;
                        }
            
                        skip += count;
            
                        if (typeof resp.pagination.total !== 'undefined' && skip >= resp.pagination.total) {
                            break;
                        }
                    }
            
                    return {
                        data: all,
                        pagination: {
                            total: all.length,
                            count: all.length,
                            skip: 0,
                            limit: limit
                        }
                    };
                },
            
                safeGetAll: function (target, key, path, query, errors) {
                    try {
                        target[key] = this.getAll(path, query || {});
                    }
                    catch (error) {
                        target[key] = {
                            data: [],
                            pagination: {
                                total: 0,
                                count: 0,
                                skip: 0,
                                limit: this.params.page_limit
                            }
                        };
                        errors.push(key + ': ' + error);
                    }
                },
            
                calcSummary: function (data) {
                    var summary = {
                            proxiesCount: 0,
                            managedServersCount: 0,
                            repositoriesCount: 0,
                            jobsCount: 0,
                            totalRepoCapacityGB: 0,
                            totalRepoFreeGB: 0,
                            totalRepoUsedGB: 0,
                            repositoriesOnline: 0,
                            repositoriesOffline: 0
                        },
                        repos = (data.repositories_states && data.repositories_states.data) ? data.repositories_states.data : [],
                        i,
                        repo;
            
                    summary.proxiesCount = (data.proxies && data.proxies.data) ? data.proxies.data.length : 0;
                    summary.managedServersCount = (data.managedServers && data.managedServers.data) ? data.managedServers.data.length : 0;
                    summary.repositoriesCount = repos.length;
                    summary.jobsCount = (data.jobs_states && data.jobs_states.data) ? data.jobs_states.data.length : 0;
            
                    for (i = 0; i < repos.length; i++) {
                        repo = repos[i];
                        summary.totalRepoCapacityGB += parseFloat(repo.capacityGB || 0);
                        summary.totalRepoFreeGB += parseFloat(repo.freeGB || 0);
                        summary.totalRepoUsedGB += parseFloat(repo.usedSpaceGB || 0);
            
                        if (repo.isOnline) {
                            summary.repositoriesOnline += 1;
                        }
                        else {
                            summary.repositoriesOffline += 1;
                        }
                    }
            
                    return summary;
                },
            
                getMetricsData: function () {
                    var data = {},
                        errors = [];
            
                    this.safeGetAll(data, 'proxies', 'api/v1/backupInfrastructure/proxies', {}, errors);
                    this.safeGetAll(data, 'managedServers', 'api/v1/backupInfrastructure/managedServers', {}, errors);
                    this.safeGetAll(data, 'repositories_states', 'api/v1/backupInfrastructure/repositories/states', {}, errors);
                    this.safeGetAll(data, 'jobs_states', 'api/v1/jobs/states', {}, errors);
            
                    data.summary = this.calcSummary(data);
                    data.error = errors.join(' | ');
            
                    return data;
                }
            };
            
            try {
                Veeam.setParams(JSON.parse(value));
                Veeam.login();
                return JSON.stringify(Veeam.getMetricsData());
            }
            catch (error) {
                error += (String(error).slice(-1) === '.') ? '' : '.';
                Zabbix.log(3, '[ VEEAM ] ERROR: ' + error);
                return JSON.stringify({ error: error });
            }
          description: 'Collects infrastructure, repositories, proxies and job-state data from the Veeam REST API.'
          timeout: '{$VEEAM.DATA.TIMEOUT}'
          parameters:
            - name: api_endpoint
              value: '{$VEEAM.API.URL}'
            - name: api_version
              value: '{$VEEAM.API.VERSION}'
            - name: http_proxy
              value: '{$VEEAM.HTTP.PROXY}'
            - name: page_limit
              value: '{$VEEAM.PAGE.LIMIT}'
            - name: password
              value: '{$VEEAM.PASSWORD}'
            - name: user
              value: '{$VEEAM.USER}'
          tags:
            - tag: component
              value: raw
