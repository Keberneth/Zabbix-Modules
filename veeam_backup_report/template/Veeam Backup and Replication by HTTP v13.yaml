            - uuid: fdc8f0d59c4541249baf2b17ae3d3338
              name: 'Repository [{#NAME}] [{#TYPE}]: Free percent [{#PATH}]'
              type: DEPENDENT
              key: 'veeam.repository.free.pct[{#ID}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              description: 'Current free repository space as percentage of capacity.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      
                      var o = JSON.parse(value),
                          capacity = parseFloat(o.capacityGB || 0),
                          free = parseFloat(o.freeGB || 0);
                      
                      if (capacity <= 0) {
                          return 0;
                      }
                      
                      return Math.round((free / capacity) * 10000) / 100;
              master_item:
                key: 'veeam.repositories.raw[{#ID}]'
              tags:
                - tag: component
                  value: repositories
                - tag: path
                  value: '{#PATH}'
                - tag: repository
                  value: '{#NAME}'
                - tag: type
