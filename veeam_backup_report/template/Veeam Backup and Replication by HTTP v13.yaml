zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 8879279c60a3406488a39497f2044629
      name: Templates/Applications
  templates:
    - uuid: 3dca8413400041efa8c32b7180c1fd0a
      template: 'Veeam Backup and Replication by HTTP v13'
      name: 'Veeam Backup and Replication by HTTP v13'
      description: |
        This template monitors Veeam Backup & Replication 13 by using the REST API over HTTPS.
        
        What is new compared with the older HTTP template:
          * Uses a macro-driven API version header for VBR 13.
          * Adds rolling backup-size reporting per repository and per protected object/host.
          * Adds rolling totals for 24h and 31d windows.
          * Replaces placeholder regex macros with safe defaults.
          * Removes session LLD to avoid high-cardinality churn and focuses on durable reporting data.
        
        Important notes:
          * The backup report is a rolling window based on Veeam REST data, not historical backfill in Zabbix.
          * Protected-object attribution is exact when Veeam exposes a unique backup file/object relation.
            If Veeam uses shared or legacy single-file chains, unresolved bytes are kept in global
            shared/unassigned items instead of being guessed.
        
        Setup:
          1. Link the template to a host that represents the Veeam Backup & Replication server.
          2. Set {$VEEAM.API.URL}, {$VEEAM.USER}, {$VEEAM.PASSWORD}, and confirm {$VEEAM.API.VERSION}.
          3. Make sure the Veeam HTTPS certificate is trusted by the Zabbix server/proxy OS.
          4. Wait for the master items to collect data and check the two error items first if data is missing.
      vendor:
        name: Iver
        version: 7.0.0
      groups:
        - name: Templates/Applications
      items:
        - uuid: 288b494e47694d5aa1c7d2b3c1a9e23f
          name: 'Backup size assigned to protected objects 31d'
          type: DEPENDENT
          key: veeam.backup.total.assigned.size.31d
          delay: '0'
          units: B
          description: 'Rolling backup size total from Veeam backup files.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.assignedBackupSize31d
          master_item:
            key: veeam.get.backup.report
          tags:
            - tag: component
              value: backup-report
        - uuid: 5da9e6b54f614144aa30cc3eefb1c2c4
          name: 'Backup attribution coverage 31d'
          type: DEPENDENT
          key: veeam.backup.total.attribution.coverage
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Percent of rolling 31-day backup size that could be safely attributed to a protected object/host.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.attributionCoveragePct31d
          master_item:
            key: veeam.get.backup.report
          tags:
            - tag: component
              value: backup-report
        - uuid: 5e9fec549db04d0e8a8ef5f8c11aaa0b
          name: 'Backup size shared or unassigned 31d'
          type: DEPENDENT
          key: veeam.backup.total.shared.size.31d
          delay: '0'
          units: B
          description: 'Rolling backup size total from Veeam backup files.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.sharedUnassignedBackupSize31d
          master_item:
            key: veeam.get.backup.report
          tags:
            - tag: component
              value: backup-report
        - uuid: 5ee448d944ff40e999d3f3d9e28db1a5
          name: 'Backup size total 24h'
          type: DEPENDENT
          key: veeam.backup.total.size.24h
          delay: '0'
          units: B
          description: 'Rolling backup size total from Veeam backup files.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.backupSize24h
          master_item:
            key: veeam.get.backup.report
          tags:
            - tag: component
              value: backup-report
        - uuid: 81ba34027af54191a7a379278bf9cb42
          name: 'Backup size total 31d'
          type: DEPENDENT
          key: veeam.backup.total.size.31d
          delay: '0'
          units: B
          description: 'Rolling backup size total from Veeam backup files.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.summary.backupSize31d
          master_item:
            key: veeam.get.backup.report
          tags:
            - tag: component
              value: backup-report
          triggers:
            - uuid: c19ac5b6b273e8bb2fccbbf8008a525c
              expression: 'nodata(/Veeam Backup and Replication by HTTP v13/veeam.backup.total.size.31d,{$VEEAM.BACKUP.REPORT.NODATA})=1'
              name: 'No data from Veeam rolling backup report'
              priority: WARNING
              description: 'The rolling backup report master item has not produced data within the configured period. Check the backup-report error item and API connectivity.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: c7d1a941b6e046db8f34e56a6d476758
          name: 'Get backup report errors'
          type: DEPENDENT
          key: veeam.get.backup.errors
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Errors returned by the rolling backup report master item.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: veeam.get.backup.report
          tags:
            - tag: component
              value: backup-report
            - tag: component
              value: status
          triggers:
            - uuid: 3502ac18aa674d499aba155e732dc8b4
              expression: 'length(last(/Veeam Backup and Replication by HTTP v13/veeam.get.backup.errors))>0'
              name: 'There are errors in requests to Veeam API (backup report)'
              opdata: '{ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Zabbix has received errors while requesting Veeam rolling backup report data.'
              tags:
                - tag: scope
                  value: availability
        - uuid: ac783e3a90614ff094f64a9b4d51f504
          name: 'Get backup report'
          type: SCRIPT
          key: veeam.get.backup.report
          delay: '{$VEEAM.BACKUP.REPORT.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var Veeam = {
                params: {},
                token: '',
            
                setParams: function (params) {
                    var required = ['api_endpoint', 'api_version', 'page_limit', 'report_days', 'user', 'password'],
                        i;
            
                    for (i = 0; i < required.length; i++) {
                        if (typeof params !== 'object' || typeof params[required[i]] === 'undefined' || params[required[i]] === '') {
                            throw 'Required param is not set: ' + required[i] + '.';
                        }
                    }
            
                    this.params = params;
            
                    if (typeof this.params.api_endpoint === 'string' && !/\/$/.test(this.params.api_endpoint)) {
                        this.params.api_endpoint += '/';
                    }
            
                    this.params.page_limit = parseInt(this.params.page_limit, 10);
                    this.params.report_days = parseInt(this.params.report_days, 10);
            
                    if (isNaN(this.params.page_limit) || this.params.page_limit < 1 || this.params.page_limit > 1000) {
                        throw 'Incorrect "page_limit" parameter given: ' + params.page_limit + '. Must be between 1 and 1000.';
                    }
            
                    if (isNaN(this.params.report_days) || this.params.report_days < 1 || this.params.report_days > 365) {
                        throw 'Incorrect "report_days" parameter given: ' + params.report_days + '. Must be between 1 and 365.';
                    }
                },
            
                buildUrl: function (path, query) {
                    var url = this.params.api_endpoint + String(path).replace(/^\//, ''),
                        parts = [],
                        k;
            
                    query = query || {};
            
                    for (k in query) {
                        if (query.hasOwnProperty(k) && query[k] !== '' && query[k] !== null && typeof query[k] !== 'undefined') {
                            parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(query[k]));
                        }
                    }
            
                    if (parts.length) {
                        url += ((url.indexOf('?') === -1) ? '?' : '&') + parts.join('&');
                    }
            
                    return url;
                },
            
                iso: function (timestamp) {
                    return new Date(timestamp).toISOString().replace(/\.\d+Z$/, 'Z');
                },
            
                round2: function (value) {
                    return Math.round(value * 100) / 100;
                },
            
                simpleHash: function (value) {
                    var hash = 0,
                        i,
                        chr,
                        hex;
            
                    value = String(value || '');
            
                    for (i = 0; i < value.length; i++) {
                        chr = value.charCodeAt(i);
                        hash = ((hash << 5) - hash) + chr;
                        hash = hash & hash;
                    }
            
                    if (hash < 0) {
                        hash = hash * -1;
                    }
            
                    hex = hash.toString(16);
                    while (hex.length < 8) {
                        hex = '0' + hex;
                    }
            
                    return hex;
                },
            
                objectFallbackKey: function (platformName, name) {
                    return 'rp-' + this.simpleHash((platformName || '') + '|' + (name || ''));
                },
            
                normalizeBool: function (value) {
                    return value ? 1 : 0;
                },
            
                createRequest: function () {
                    var req = new HttpRequest();
            
                    if (typeof this.params.http_proxy !== 'undefined' && this.params.http_proxy !== '') {
                        req.setProxy(this.params.http_proxy);
                    }
            
                    req.addHeader('Authorization: Bearer ' + this.token);
                    req.addHeader('x-api-version: ' + this.params.api_version);
            
                    return req;
                },
            
                login: function () {
                    var req = new HttpRequest(),
                        resp;
            
                    if (typeof this.params.http_proxy !== 'undefined' && this.params.http_proxy !== '') {
                        req.setProxy(this.params.http_proxy);
                    }
            
                    req.addHeader('Content-Type: application/x-www-form-urlencoded');
                    req.addHeader('x-api-version: ' + this.params.api_version);
            
                    resp = req.post(
                        this.params.api_endpoint + 'api/oauth2/token',
                        'grant_type=password&username=' + encodeURIComponent(this.params.user) +
                        '&password=' + encodeURIComponent(this.params.password)
                    );
            
                    if (req.getStatus() !== 200 || resp === null) {
                        throw 'Login failed with status code ' + req.getStatus() + ': ' + resp;
                    }
            
                    try {
                        resp = JSON.parse(resp);
                    }
                    catch (error) {
                        throw 'Failed to parse authentication token for the logon session.';
                    }
            
                    if (!resp.hasOwnProperty('access_token')) {
                        throw 'Auth response does not contain access token.';
                    }
            
                    this.token = resp.access_token;
                },
            
                request: function (url) {
                    var req = this.createRequest(),
                        resp;
            
                    resp = req.get(url);
            
                    if (req.getStatus() !== 200 || resp === null) {
                        throw 'Request failed with status code ' + req.getStatus() + ': ' + resp;
                    }
            
                    try {
                        return JSON.parse(resp);
                    }
                    catch (error) {
                        throw 'Failed to parse response received from API.';
                    }
                },
            
                getAll: function (path, query) {
                    var all = [],
                        skip = 0,
                        limit = this.params.page_limit,
                        resp,
                        count,
                        i,
                        guard = 0,
                        pageQuery,
                        pagination = {
                            total: 0,
                            count: 0,
                            skip: 0,
                            limit: limit
                        };
            
                    query = query || {};
            
                    while (true) {
                        guard += 1;
            
                        if (guard > 5000) {
                            throw 'Pagination guard limit exceeded for endpoint: ' + path;
                        }
            
                        pageQuery = {};
                        for (i in query) {
                            if (query.hasOwnProperty(i)) {
                                pageQuery[i] = query[i];
                            }
                        }
            
                        pageQuery.skip = skip;
                        pageQuery.limit = limit;
            
                        resp = this.request(this.buildUrl(path, pageQuery));
            
                        if (typeof resp !== 'object' || resp === null) {
                            throw 'Unexpected API response for endpoint: ' + path;
                        }
            
                        if (!resp.hasOwnProperty('data')) {
                            return resp;
                        }
            
                        count = resp.data.length;
            
                        for (i = 0; i < count; i++) {
                            all.push(resp.data[i]);
                        }
            
                        if (resp.hasOwnProperty('pagination')) {
                            pagination = resp.pagination;
                        }
            
                        if (!resp.hasOwnProperty('pagination') || count === 0 || count < limit) {
                            break;
                        }
            
                        skip += count;
            
                        if (typeof resp.pagination.total !== 'undefined' && skip >= resp.pagination.total) {
                            break;
                        }
                    }
            
                    return {
                        data: all,
                        pagination: {
                            total: all.length,
                            count: all.length,
                            skip: 0,
                            limit: limit
                        }
                    };
                },
            
                safeGetAll: function (target, key, path, query, errors) {
                    try {
                        target[key] = this.getAll(path, query || {});
                    }
                    catch (error) {
                        target[key] = {
                            data: [],
                            pagination: {
                                total: 0,
                                count: 0,
                                skip: 0,
                                limit: this.params.page_limit
                            }
                        };
                        errors.push(key + ': ' + error);
                    }
                },
            
                ensureObject: function (objects, key, data) {
                    var base = data || {},
                        k;
            
                    if (!objects.hasOwnProperty(key)) {
                        objects[key] = {
                            key: key,
                            name: base.name || 'Unknown',
                            platformName: base.platformName || '',
                            type: base.type || '',
                            sourceId: base.sourceId || '',
                            backupObjectId: base.backupObjectId || '',
                            restorePoints31d: 0,
                            backupFiles31d: 0,
                            backupSize24h: 0,
                            backupSize31d: 0,
                            lastBackupTime: '',
                            repositories: {},
                            _attrObjectId: 0,
                            _attrRestorePointName: 0
                        };
                    }
            
                    for (k in base) {
                        if (base.hasOwnProperty(k) && (objects[key][k] === '' || typeof objects[key][k] === 'undefined')) {
                            objects[key][k] = base[k];
                        }
                    }
            
                    return objects[key];
                },
            
                repoNameList: function (repoMap) {
                    var out = [],
                        k;
            
                    for (k in repoMap) {
                        if (repoMap.hasOwnProperty(k)) {
                            out.push(k);
                        }
                    }
            
                    out.sort();
            
                    return out.join(', ');
                },
            
                mapSize: function (input) {
                    var count = 0,
                        k;
            
                    for (k in input) {
                        if (input.hasOwnProperty(k)) {
                            count += 1;
                        }
                    }
            
                    return count;
                },
            
                firstMapKey: function (input) {
                    var k;
            
                    for (k in input) {
                        if (input.hasOwnProperty(k)) {
                            return k;
                        }
                    }
            
                    return '';
                },
            
                getBackupReport: function () {
                    var raw = {},
                        errors = [],
                        nowMs = (new Date()).getTime(),
                        from24Ms = nowMs - 86400000,
                        fromWindowMs = nowMs - (this.params.report_days * 86400000),
                        from24 = this.iso(from24Ms),
                        fromWindow = this.iso(fromWindowMs),
                        repos = [],
                        repoIndex = {},
                        backupIndex = {},
                        backupObjectByObjectId = {},
                        backupObjectByNamePlatform = {},
                        objects = {},
                        recentBackupIds = {},
                        backupFileObjectCandidates = {},
                        i,
                        repo,
                        backup,
                        bo,
                        rp,
                        rpNameKey,
                        objectKey,
                        obj,
                        backupId,
                        filesResp,
                        files,
                        bf,
                        bfSize,
                        bfTimeMs,
                        in24,
                        assigned31 = 0,
                        total31 = 0,
                        total24 = 0,
                        shared31 = 0,
                        protectedObjects = [],
                        summary,
                        repoIds = [];
            
                    this.safeGetAll(raw, 'repositories_states', 'api/v1/backupInfrastructure/repositories/states', {}, errors);
                    this.safeGetAll(raw, 'backups', 'api/v1/backups', {}, errors);
                    this.safeGetAll(raw, 'backupObjects', 'api/v1/backupObjects', {}, errors);
                    this.safeGetAll(raw, 'restorePoints', 'api/v1/restorePoints', { createdAfterFilter: fromWindow }, errors);
            
                    for (i = 0; i < raw.repositories_states.data.length; i++) {
                        repo = raw.repositories_states.data[i];
                        repoIndex[repo.id] = {
                            id: repo.id,
                            name: repo.name || '',
                            hostName: repo.hostName || '',
                            path: repo.path || '',
                            type: repo.type || '',
                            capacityGB: parseFloat(repo.capacityGB || 0),
                            freeGB: parseFloat(repo.freeGB || 0),
                            usedSpaceGB: parseFloat(repo.usedSpaceGB || 0),
                            freePct: (parseFloat(repo.capacityGB || 0) > 0) ? this.round2((parseFloat(repo.freeGB || 0) / parseFloat(repo.capacityGB || 0)) * 100) : 0,
                            isOnline: !!repo.isOnline,
                            isOutOfDate: !!repo.isOutOfDate,
                            backupSize24h: 0,
                            backupSize31d: 0,
                            backupFiles24h: 0,
                            backupFiles31d: 0
                        };
                        repoIds.push(repo.id);
                    }
            
                    for (i = 0; i < raw.backups.data.length; i++) {
                        backup = raw.backups.data[i];
                        backupIndex[backup.id] = backup;
                    }
            
                    for (i = 0; i < raw.backupObjects.data.length; i++) {
                        bo = raw.backupObjects.data[i];
                        objectKey = bo.id ? bo.id : this.objectFallbackKey(bo.platformName, bo.name);
                        bo._zbx_key = objectKey;
            
                        if (bo.objectId !== '' && typeof bo.objectId !== 'undefined') {
                            backupObjectByObjectId[String(bo.objectId)] = bo;
                        }
            
                        backupObjectByNamePlatform[(bo.platformName || '') + '|' + String(bo.name || '').toLowerCase()] = bo;
            
                        this.ensureObject(objects, objectKey, {
                            name: bo.name || 'Unknown',
                            platformName: bo.platformName || '',
                            type: bo.type || '',
                            sourceId: bo.id || '',
                            backupObjectId: bo.objectId || ''
                        });
                    }
            
                    for (i = 0; i < raw.restorePoints.data.length; i++) {
                        rp = raw.restorePoints.data[i];
                        if (rp.backupId) {
                            recentBackupIds[rp.backupId] = 1;
                        }
            
                        rpNameKey = (rp.platformName || '') + '|' + String(rp.name || '').toLowerCase();
                        bo = backupObjectByNamePlatform.hasOwnProperty(rpNameKey) ? backupObjectByNamePlatform[rpNameKey] : null;
                        objectKey = bo ? bo._zbx_key : this.objectFallbackKey(rp.platformName, rp.name);
            
                        obj = this.ensureObject(objects, objectKey, {
                            name: rp.name || 'Unknown',
                            platformName: rp.platformName || '',
                            type: rp.type || '',
                            sourceId: bo ? (bo.id || '') : '',
                            backupObjectId: bo ? (bo.objectId || '') : ''
                        });
            
                        obj.restorePoints31d += 1;
            
                        if (rp.creationTime && (!obj.lastBackupTime || (new Date(rp.creationTime)).getTime() > (new Date(obj.lastBackupTime)).getTime())) {
                            obj.lastBackupTime = rp.creationTime;
                        }
            
                        if (rp.backupFileId) {
                            if (!backupFileObjectCandidates.hasOwnProperty(rp.backupFileId)) {
                                backupFileObjectCandidates[rp.backupFileId] = {};
                            }
                            backupFileObjectCandidates[rp.backupFileId][objectKey] = 1;
                        }
            
                        if (rp.backupId && backupIndex.hasOwnProperty(rp.backupId) && backupIndex[rp.backupId].repositoryName) {
                            obj.repositories[backupIndex[rp.backupId].repositoryName] = 1;
                        }
                    }
            
                    for (backupId in recentBackupIds) {
                        if (!recentBackupIds.hasOwnProperty(backupId)) {
                            continue;
                        }
            
                        if (!backupIndex.hasOwnProperty(backupId)) {
                            errors.push('backups: recent backup "' + backupId + '" was referenced by a restore point but not returned by /api/v1/backups');
                            continue;
                        }
            
                        backup = backupIndex[backupId];
            
                        try {
                            filesResp = this.getAll(
                                'api/v1/backups/' + backupId + '/backupFiles',
                                { createdAfterFilter: fromWindow }
                            );
                        }
                        catch (error) {
                            errors.push('backupFiles[' + backupId + ']: ' + error);
                            continue;
                        }
            
                        files = filesResp.data || [];
            
                        for (i = 0; i < files.length; i++) {
                            bf = files[i];
                            bfSize = parseInt(bf.backupSize || 0, 10);
            
                            if (isNaN(bfSize) || bfSize < 0) {
                                bfSize = 0;
                            }
            
                            bfTimeMs = bf.creationTime ? (new Date(bf.creationTime)).getTime() : 0;
                            in24 = bfTimeMs >= from24Ms;
            
                            total31 += bfSize;
                            if (in24) {
                                total24 += bfSize;
                            }
            
                            if (backup.repositoryId && repoIndex.hasOwnProperty(backup.repositoryId)) {
                                repoIndex[backup.repositoryId].backupSize31d += bfSize;
                                repoIndex[backup.repositoryId].backupFiles31d += 1;
            
                                if (in24) {
                                    repoIndex[backup.repositoryId].backupSize24h += bfSize;
                                    repoIndex[backup.repositoryId].backupFiles24h += 1;
                                }
                            }
            
                            objectKey = '';
            
                            if (typeof bf.objectId !== 'undefined' && bf.objectId !== '' &&
                                backupObjectByObjectId.hasOwnProperty(String(bf.objectId))) {
                                objectKey = backupObjectByObjectId[String(bf.objectId)]._zbx_key;
                            }
                            else if (bf.id && backupFileObjectCandidates.hasOwnProperty(bf.id) &&
                                this.mapSize(backupFileObjectCandidates[bf.id]) === 1) {
                                objectKey = this.firstMapKey(backupFileObjectCandidates[bf.id]);
                            }
            
                            if (objectKey !== '' && objects.hasOwnProperty(objectKey)) {
                                obj = objects[objectKey];
                                obj.backupSize31d += bfSize;
                                obj.backupFiles31d += 1;
            
                                if (in24) {
                                    obj.backupSize24h += bfSize;
                                }
            
                                if (bf.creationTime && (!obj.lastBackupTime || bfTimeMs > (new Date(obj.lastBackupTime)).getTime())) {
                                    obj.lastBackupTime = bf.creationTime;
                                }
            
                                if (backup.repositoryName) {
                                    obj.repositories[backup.repositoryName] = 1;
                                }
            
                                if (typeof bf.objectId !== 'undefined' && bf.objectId !== '' &&
                                    backupObjectByObjectId.hasOwnProperty(String(bf.objectId))) {
                                    obj._attrObjectId += 1;
                                }
                                else {
                                    obj._attrRestorePointName += 1;
                                }
            
                                assigned31 += bfSize;
                            }
                            else {
                                shared31 += bfSize;
                            }
                        }
                    }
            
                    repoIds.sort(function (a, b) {
                        var an = repoIndex[a].name.toLowerCase(),
                            bn = repoIndex[b].name.toLowerCase();
            
                        if (an < bn) {
                            return -1;
                        }
                        if (an > bn) {
                            return 1;
                        }
                        return 0;
                    });
            
                    for (i = 0; i < repoIds.length; i++) {
                        repos.push(repoIndex[repoIds[i]]);
                    }
            
                    for (objectKey in objects) {
                        if (!objects.hasOwnProperty(objectKey)) {
                            continue;
                        }
            
                        obj = objects[objectKey];
            
                        if (obj.restorePoints31d === 0 && obj.backupFiles31d === 0) {
                            continue;
                        }
            
                        if (obj._attrObjectId > 0 && obj._attrRestorePointName === 0) {
                            obj.attributionMode = 'backupFile.objectId';
                        }
                        else if (obj._attrObjectId === 0 && obj._attrRestorePointName > 0) {
                            obj.attributionMode = 'restorePointName';
                        }
                        else if (obj._attrObjectId > 0 && obj._attrRestorePointName > 0) {
                            obj.attributionMode = 'mixed';
                        }
                        else {
                            obj.attributionMode = 'unresolved';
                        }
            
                        obj.repositories = this.repoNameList(obj.repositories);
                        delete obj._attrObjectId;
                        delete obj._attrRestorePointName;
            
                        protectedObjects.push(obj);
                    }
            
                    protectedObjects.sort(function (a, b) {
                        var an = String(a.name || '').toLowerCase(),
                            bn = String(b.name || '').toLowerCase();
            
                        if (an < bn) {
                            return -1;
                        }
                        if (an > bn) {
                            return 1;
                        }
            
                        if (a.platformName < b.platformName) {
                            return -1;
                        }
                        if (a.platformName > b.platformName) {
                            return 1;
                        }
            
                        return 0;
                    });
            
                    summary = {
                        generatedAt: this.iso(nowMs),
                        reportDays: this.params.report_days,
                        reportFrom: fromWindow,
                        repositoriesCount: repos.length,
                        protectedObjectsCount: protectedObjects.length,
                        totalRepoCapacityGB: 0,
                        totalRepoFreeGB: 0,
                        totalRepoUsedGB: 0,
                        backupSize24h: total24,
                        backupSize31d: total31,
                        assignedBackupSize31d: assigned31,
                        sharedUnassignedBackupSize31d: shared31,
                        attributionCoveragePct31d: total31 > 0 ? this.round2((assigned31 / total31) * 100) : 100
                    };
            
                    for (i = 0; i < repos.length; i++) {
                        summary.totalRepoCapacityGB += repos[i].capacityGB;
                        summary.totalRepoFreeGB += repos[i].freeGB;
                        summary.totalRepoUsedGB += repos[i].usedSpaceGB;
                    }
            
                    return {
                        summary: summary,
                        repositories: repos,
                        backup_objects: protectedObjects,
                        error: errors.join(' | ')
                    };
                }
            };
            
            try {
                Veeam.setParams(JSON.parse(value));
                Veeam.login();
                return JSON.stringify(Veeam.getBackupReport());
            }
            catch (error) {
                error += (String(error).slice(-1) === '.') ? '' : '.';
                Zabbix.log(3, '[ VEEAM BACKUP REPORT ] ERROR: ' + error);
                return JSON.stringify({ error: error });
            }
          description: 'Collects rolling backup size totals and protected-object attribution data for the last N days.'
