        - macro: '{$VEEAM.OBJECT.PLATFORM.MATCHES}'
          value: '.*'
          description: 'Regex include filter used by protected-object discovery.'
        - macro: '{$VEEAM.OBJECT.PLATFORM.NOT_MATCHES}'
          value: ^$
          description: 'Regex exclude filter used by protected-object discovery.'
        - macro: '{$VEEAM.PAGE.LIMIT}'
          value: '200'
          description: 'REST API page size used by the script items.'
        - macro: '{$VEEAM.PASSWORD}'
          type: SECRET_TEXT
          description: 'Password used to obtain a Veeam OAuth token.'
        - macro: '{$VEEAM.REPO.FREE.PCT.CRIT}'
          value: '5'
          description: 'High-severity threshold for repository free space percent. Keep it below {$VEEAM.REPO.FREE.PCT.MIN}.'
        - macro: '{$VEEAM.REPO.FREE.PCT.MIN}'
          value: '10'
          description: 'Warning threshold for repository free space percent.'
        - macro: '{$VEEAM.USER}'
          type: SECRET_TEXT
          description: 'Username used to obtain a Veeam OAuth token.'
      valuemaps:
        - uuid: e89f1117e1d5eff5f0826eae2f4bd4a0
          name: 'Veeam online state'
          mappings:
            - value: '0'
              newvalue: Offline
            - value: '1'
              newvalue: Online
        - uuid: 06df312230d785854bcce106ceea65ac
          name: 'Veeam up-to-date state'
          mappings:
            - value: '0'
              newvalue: 'Up to date'
            - value: '1'
              newvalue: 'Out of date'
  triggers:
    - uuid: 3fccb700fef8d44137b95150a6394c75
      expression: 'last(/Veeam Backup and Replication by HTTP v13/veeam.backup.total.size.24h)=0 and last(/Veeam Backup and Replication by HTTP v13/veeam.backup.total.size.31d)>0'
      name: 'No backups in the last 24 hours'
      opdata: '24h: {ITEM.LASTVALUE1}, 31d: {ITEM.LASTVALUE2}'
      priority: WARNING
      description: 'No backup files were written in the last 24 hours even though the rolling 31-day window has backup data. Check job schedules and recent job results.'
      manual_close: 'YES'
      tags:
        - tag: scope
          value: availability
    - uuid: 302976398d00435e84164cfd0de37064
      expression: 'last(/Veeam Backup and Replication by HTTP v13/veeam.backup.total.attribution.coverage)<100 and last(/Veeam Backup and Replication by HTTP v13/veeam.backup.total.shared.size.31d)>0'
      name: 'Some rolling backup size cannot be attributed to a protected object'
      opdata: 'Coverage: {ITEM.LASTVALUE1}%'
      priority: INFO
      description: 'Some backup bytes are in shared or legacy chains and cannot be assigned safely to a single object. Check the shared/unassigned total.'
      manual_close: 'YES'
      tags:
        - tag: scope
          value: capacity
